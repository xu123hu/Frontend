<text x="28" y="46" font-weight="bold" font-size="18">8．（本题 14 分）椭圆及其标准方程</text>
<text x="28" y="88">已知椭圆 C：x²/a² + y²/b² = 1（a＞b＞0）的左、右焦点</text>
<text x="28" y="120">分别为 F₁(−√3, 0)、F₂(√3, 0)，且椭圆经过点 P(2, 1)。</text>
<text x="28" y="152">（1）求椭圆 C 的标准方程；</text>
<text x="28" y="184">（2）过 F₂ 的直线 l 与椭圆交于 A、B 两点，求 △OAB</text>
<text x="28" y="216">面积的最大值。</text>
</g>
