<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
<rect width="560" height="400" fill="#fffdf8"/>
<rect x="6" y="6" width="548" height="388" fill="none" stroke="#e7e5e4"/>
<g font-family="'KaiTi','楷体','STKaiti',cursive" font-size="19" fill="#1c1917">
<text x="30" y="52">错题：切线方程</text>
<text x="30" y="100">求曲线 y = x³ − 3x 过点 P(1, −2) 的切线方程。</text>
<text x="30" y="160">我的答案：y + 2 = 0（认为 P 处切线水平）</text>
<text x="30" y="220">错因：P 在曲线上，但 y′(1) = 3−3 = 0 只说明切线</text>
<text x="30" y="252">斜率为 0，切线应为 y = −2，不是 y+2=0！</text>
<text x="30" y="316" fill="#16a34a">正确答案：y = −2</text>
<text x="30" y="360" fill="#78716c" font-size="16">另：若“过曲线外一点”需设切点，别再混了。</text>
</g>
<circle cx="250" cy="292" r="44" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.55"/>
</svg>
