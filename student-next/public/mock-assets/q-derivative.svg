<text x="28" y="46" font-weight="bold" font-size="18">21．（本题 12 分）导数的几何意义</text>
<text x="28" y="88">已知曲线 C：y = x³ − 3x。</text>
<text x="28" y="120">（1）求曲线 C 在点 (1, −2) 处的切线方程；</text>
<text x="28" y="152">（2）直线 l 经过原点且与曲线 C 相切，这样的直线共有几条？</text>
<text x="28" y="184">请说明理由。</text>
</g>
