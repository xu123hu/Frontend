<text x="28" y="46" font-weight="bold" font-size="18">15．（本题 13 分）解三角形</text>
<text x="28" y="88">在 △ABC 中，内角 A、B、C 所对的边分别为 a、b、c，</text>
<text x="28" y="120">已知 a = 2，b = √6，B = 2A。</text>
<text x="28" y="152">（1）求角 A 的大小；</text>
<text x="28" y="184">（2）求 △ABC 的面积。</text>
</g>
