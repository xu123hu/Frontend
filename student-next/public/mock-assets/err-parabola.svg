<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
<rect width="560" height="400" fill="#fffdf8"/>
<rect x="6" y="6" width="548" height="388" fill="none" stroke="#e7e5e4"/>
<g font-family="'KaiTi','楷体','STKaiti',cursive" font-size="19" fill="#1c1917">
<text x="30" y="52">错题：抛物线焦点弦</text>
<text x="30" y="100">抛物线 y² = 4x 的焦点为 F，过 F 的直线交于</text>
<text x="30" y="136">A、B，若 |AF| = 3，求 |BF|。</text>
<text x="30" y="188">我的答案：|BF| = 3（对称想当然）</text>
<text x="30" y="236">错因：焦点弦不总是对称的！应设直线代入。</text>
<text x="30" y="284">由 |AF| = x_A + 1 = 3 → x_A = 2，直线斜率 k 求出后</text>
<text x="30" y="316">得 x_B = 1/2，|BF| = x_B + 1 = 3/2 ✓</text>
<text x="30" y="352" fill="#16a34a">正确答案：|BF| = 3/2</text>
</g>
<circle cx="262" cy="184" r="40" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.55"/>
</svg>
