<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
<rect width="560" height="400" fill="#fffdf8"/>
<rect x="6" y="6" width="548" height="388" fill="none" stroke="#e7e5e4"/>
<g font-family="'KaiTi','楷体','STKaiti',cursive" font-size="19" fill="#1c1917">
<text x="30" y="52">错题：空间向量求二面角</text>
<text x="30" y="100">用 n₁、n₂ 分别是两平面的法向量，cos〈n₁,n₂〉= −1/2，</text>
<text x="30" y="136">则二面角为 ____。</text>
<text x="30" y="188">我的答案：60°</text>
<text x="30" y="236">错因：没结合图形判断二面角是锐角还是钝角！</text>
<text x="30" y="284">图形中二面角为钝角，cosθ = −1/2 → θ = 120° ✓</text>
<text x="30" y="344" fill="#16a34a">正确答案：120°</text>
</g>
<circle cx="222" cy="184" r="40" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.55"/>
</svg>
