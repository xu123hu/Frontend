<text x="28" y="46" font-weight="bold" font-size="18">12．（本题 12 分）抛物线与焦点弦</text>
<text x="28" y="88">已知抛物线 C：y² = 2px（p＞0）经过点 P(2, 2√2)。</text>
<text x="28" y="120">（1）求抛物线 C 的方程及其焦点 F 的坐标；</text>
<text x="28" y="152">（2）过焦点 F 的直线交 C 于 A、B，若 |AF| = 2|BF|，</text>
<text x="28" y="184">求弦 |AB| 的长。</text>
