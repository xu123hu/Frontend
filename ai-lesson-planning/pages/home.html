    <style id="theme-vars">
/* ============================================================
   AI 备课工作台 - 设计令牌 / Design Tokens
   ============================================================ */

:root {
  /* ---- Primary Brand ---- */
  --ailp-primary-50: #eef2ff;
  --ailp-primary-100: #e0e7ff;
  --ailp-primary-200: #c7d2fe;
  --ailp-primary-300: #a5b4fc;
  --ailp-primary-400: #818cf8;
  --ailp-primary-500: #6366f1;
  --ailp-primary-600: #4f46e5;
  --ailp-primary-700: #4338ca;
  --ailp-primary-800: #3730a3;
  --ailp-primary-900: #312e81;

  /* ---- Accent (teal / AI glow) ---- */
  --ailp-accent-50: #ecfeff;
  --ailp-accent-100: #cffafe;
  --ailp-accent-200: #a5f3fc;
  --ailp-accent-300: #67e8f9;
  --ailp-accent-400: #22d3ee;
  --ailp-accent-500: #06b6d4;
  --ailp-accent-600: #0891b2;

  /* ---- Neutrals ---- */
  --ailp-gray-50: #f8fafc;
  --ailp-gray-100: #f1f5f9;
  --ailp-gray-200: #e2e8f0;
  --ailp-gray-300: #cbd5e1;
  --ailp-gray-400: #94a3b8;
  --ailp-gray-500: #64748b;
  --ailp-gray-600: #475569;
  --ailp-gray-700: #334155;
  --ailp-gray-800: #1e293b;
  --ailp-gray-900: #0f172a;
  --ailp-gray-950: #020617;

  /* ---- Success / Warning / Error ---- */
  --ailp-success-500: #10b981;
  --ailp-success-600: #059669;
  --ailp-warning-500: #f59e0b;
  --ailp-warning-600: #d97706;
  --ailp-error-500: #ef4444;
  --ailp-error-600: #dc2626;

  /* ---- Semantic aliases ---- */
  --ailp-background: #f8fafc;
  --ailp-foreground: #0f172a;
  --ailp-card: #ffffff;
  --ailp-card-foreground: #0f172a;
  --ailp-popover: #ffffff;
  --ailp-popover-foreground: #0f172a;
  --ailp-primary: #4f46e5;
  --ailp-primary-foreground: #ffffff;
  --ailp-secondary: #f1f5f9;
  --ailp-secondary-foreground: #0f172a;
  --ailp-muted: #f1f5f9;
  --ailp-muted-foreground: #64748b;
  --ailp-accent: #06b6d4;
  --ailp-accent-foreground: #ffffff;
  --ailp-destructive: #ef4444;
  --ailp-destructive-foreground: #ffffff;
  --ailp-border: #e2e8f0;
  --ailp-input: #e2e8f0;
  --ailp-ring: #6366f1;

  /* ---- Radius scale ---- */
  --ailp-radius-sm: 6px;
  --ailp-radius-md: 10px;
  --ailp-radius-lg: 14px;
  --ailp-radius-xl: 20px;
  --ailp-radius-2xl: 28px;
  --ailp-radius-full: 9999px;

  /* ---- Shadow scale ---- */
  --ailp-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --ailp-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --ailp-shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
  --ailp-shadow-xl: 0 20px 40px -10px rgba(15, 23, 42, 0.15);
  --ailp-shadow-glow: 0 0 30px rgba(99, 102, 241, 0.25);

  /* ---- Typography ---- */
  --ailp-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial,
    sans-serif;
  --ailp-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas,
    "Liberation Mono", Menlo, monospace;
  --ailp-font-math: "Cambria Math", "Latin Modern Math", "STIX Two Math",
    Georgia, serif;
}

/* ---- Dark mode (editor focus mode) ---- */
.dark {
  --ailp-background: #0f172a;
  --ailp-foreground: #f8fafc;
  --ailp-card: #1e293b;
  --ailp-card-foreground: #f8fafc;
  --ailp-popover: #1e293b;
  --ailp-popover-foreground: #f8fafc;
  --ailp-primary: #818cf8;
  --ailp-primary-foreground: #0f172a;
  --ailp-secondary: #334155;
  --ailp-secondary-foreground: #f8fafc;
  --ailp-muted: #334155;
  --ailp-muted-foreground: #94a3b8;
  --ailp-border: #334155;
  --ailp-input: #334155;
  --ailp-ring: #6366f1;
}

/* ---- Base reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: var(--ailp-font-sans);
  background: var(--ailp-background);
  color: var(--ailp-foreground);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--ailp-gray-300);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--ailp-gray-400);
}

/* ---- Math formula display ---- */
.math-display {
  font-family: var(--ailp-font-math);
  font-size: 1.1em;
  line-height: 1.8;
}

.math-inline {
  font-family: var(--ailp-font-math);
  font-style: italic;
}

/* ---- Utility: AI glow effect ---- */
.ai-glow {
  position: relative;
}
.ai-glow::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: linear-gradient(
    135deg,
    rgba(99, 102, 241, 0.3),
    rgba(6, 182, 212, 0.3)
  );
  filter: blur(12px);
  opacity: 0.6;
  z-index: -1;
  pointer-events: none;
}

/* ---- Gradient text ---- */
.gradient-text {
  background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ---- AI message bubble gradient ---- */
.ai-bubble-gradient {
  background: linear-gradient(
    135deg,
    rgba(99, 102, 241, 0.08) 0%,
    rgba(6, 182, 212, 0.06) 100%
  );
  border: 1px solid rgba(99, 102, 241, 0.15);
}

    <style>
      /* AI Glow animations */
      @keyframes ai-glow-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-float { animation: float 4s ease-in-out infinite; }
      .animate-glow-pulse { animation: ai-glow-pulse 3s ease-in-out infinite; }
      .animate-fade-in-up { animation: fade-in-up 0.8s ease-out both; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .delay-500 { animation-delay: 0.5s; }

      /* Input glow border effect */
      .input-glow-wrapper {
        position: relative;
        border-radius: var(--ailp-radius-2xl);
        padding: 2px;
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.4), rgba(6, 182, 212, 0.4), rgba(79, 70, 229, 0.4));
        background-size: 200% 200%;
        animation: shimmer 4s linear infinite;
      }
      .input-glow-wrapper::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: calc(var(--ailp-radius-2xl) + 6px);
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.15));
        filter: blur(16px);
        z-index: -1;
        animation: ai-glow-pulse 3s ease-in-out infinite;
      }

      /* Floating AI button */
      .floating-ai-btn {
        position: relative;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
        box-shadow: 0 8px 32px rgba(79, 70, 229, 0.4), 0 0 60px rgba(6, 182, 212, 0.2);
      }
      .floating-ai-btn::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 9999px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(6, 182, 212, 0.5));
        filter: blur(12px);
        z-index: -1;
        animation: ai-glow-pulse 2.5s ease-in-out infinite;
      }

      /* Tooltip */
      .tooltip-bubble {
        position: absolute;
        right: 100%;
        top: 50%;
        transform: translateY(-50%);
        margin-right: 12px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .tooltip-bubble::after {
        content: "";
        position: absolute;
        left: 100%;
        top: 50%;
        transform: translateY(-50%);
        border: 6px solid transparent;
        border-left-color: #1e293b;
      }
      .floating-ai-btn:hover .tooltip-bubble {
        opacity: 1;
      }

      /* Card hover effects */
      .quick-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .quick-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.15), 0 10px 20px -5px rgba(6, 182, 212, 0.1);
      }

      /* Background decorative blobs */
      .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        pointer-events: none;
      }
    </style>

          <div class="flex items-center justify-center gap-4 mt-4 text-sm text-[var(--ailp-muted-foreground)]">
            <span class="flex items-center gap-1.5">
              <i data-lucide="mic" class="w-4 h-4"></i>
              支持语音输入
            </span>
            <span class="w-1 h-1 rounded-full bg-[var(--ailp-gray-300)]"></span>
            <span class="flex items-center gap-1.5">
              <i data-lucide="upload" class="w-4 h-4"></i>
              拖拽文件上传
            </span>
            <span class="w-1 h-1 rounded-full bg-[var(--ailp-gray-300)]"></span>
            <span class="flex items-center gap-1.5">
              <i data-lucide="book-open" class="w-4 h-4"></i>
              选择教材章节
            </span>
          </div>
        </div>

        <!-- Quick Access Cards -->
        <div class="mb-14 animate-fade-in-up delay-200">
          <div class="grid grid-cols-4 gap-4">
            <!-- Card 1: From textbook -->
            <div class="quick-card bg-white/80 backdrop-blur-sm rounded-2xl p-5 border border-[var(--ailp-border)] cursor-pointer group">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#4f46e5]/10 to-[#6366f1]/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i data-lucide="book-open" class="w-6 h-6 text-[var(--ailp-primary)]"></i>
              </div>
              <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1.5">从教材开始</h3>
              <p class="text-sm text-[var(--ailp-muted-foreground)] leading-relaxed">选择教材版本与章节，AI 生成教案</p>
            </div>

            <!-- Card 2: Upload materials -->
            <div class="quick-card bg-white/80 backdrop-blur-sm rounded-2xl p-5 border border-[var(--ailp-border)] cursor-pointer group">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#06b6d4]/10 to-[#22d3ee]/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i data-lucide="file-up" class="w-6 h-6 text-[var(--ailp-accent)]"></i>
              </div>
              <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1.5">上传资料</h3>
              <p class="text-sm text-[var(--ailp-muted-foreground)] leading-relaxed">上传知识点资料或参考教案模板</p>
            </div>

            <!-- Card 3: Choose template -->
            <div class="quick-card bg-white/80 backdrop-blur-sm rounded-2xl p-5 border border-[var(--ailp-border)] cursor-pointer group">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#8b5cf6]/10 to-[#a78bfa]/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i data-lucide="layout-template" class="w-6 h-6 text-[#8b5cf6]"></i>
              </div>
              <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1.5">选择模板</h3>
              <p class="text-sm text-[var(--ailp-muted-foreground)] leading-relaxed">从教案模板库选择课型模板</p>
            </div>

            <!-- Card 4: Continue planning -->
            <div class="quick-card bg-white/80 backdrop-blur-sm rounded-2xl p-5 border border-[var(--ailp-border)] cursor-pointer group">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#f59e0b]/10 to-[#fbbf24]/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i data-lucide="rotate-ccw" class="w-6 h-6 text-[#f59e0b]"></i>
              </div>
              <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1.5">继续备课</h3>
              <p class="text-sm text-[var(--ailp-muted-foreground)] leading-relaxed">从最近的教案草稿继续编辑</p>
            </div>
          </div>
        </div>

        <!-- Recent Lesson Planning List -->
        <div class="animate-fade-in-up delay-300">
          <div class="flex items-center justify-between mb-5">
            <h2 class="text-xl font-semibold text-[var(--ailp-foreground)]">最近备课</h2>
            <a href="#" class="text-sm text-[var(--ailp-primary)] hover:text-[var(--ailp-primary-700)] flex items-center gap-1 font-medium transition-colors">
              查看全部
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </a>
          </div>

          <div class="space-y-3">
            <!-- Item 1 -->
            <div class="group bg-white/80 backdrop-blur-sm rounded-xl p-5 border border-[var(--ailp-border)] hover:border-[var(--ailp-primary)]/30 hover:shadow-md transition-all cursor-pointer">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#4f46e5] to-[#7c3aed] flex items-center justify-center text-white shadow-md">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1 group-hover:text-[var(--ailp-primary)] transition-colors">椭圆及其标准方程（第1课时）</h3>
                    <div class="flex items-center gap-2 text-sm">
                      <span class="px-2 py-0.5 rounded-md bg-[var(--ailp-muted)] text-[var(--ailp-muted-foreground)] text-xs">高二(5)班</span>
                      <span class="px-2 py-0.5 rounded-md bg-[var(--ailp-primary-50)] text-[var(--ailp-primary)] text-xs font-medium">新授课</span>
                      <span class="text-[var(--ailp-gray-400)]">·</span>
                      <span class="text-[var(--ailp-muted-foreground)] text-xs">昨天</span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="px-2.5 py-1 rounded-full bg-[var(--ailp-warning-500)]/10 text-[var(--ailp-warning-600)] text-xs font-medium">草稿</span>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--ailp-gray-300)] group-hover:text-[var(--ailp-primary)] group-hover:translate-x-0.5 transition-all"></i>
                </div>
              </div>
            </div>

            <!-- Item 2 -->
            <div class="group bg-white/80 backdrop-blur-sm rounded-xl p-5 border border-[var(--ailp-border)] hover:border-[var(--ailp-primary)]/30 hover:shadow-md transition-all cursor-pointer">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#06b6d4] to-[#0891b2] flex items-center justify-center text-white shadow-md">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1 group-hover:text-[var(--ailp-primary)] transition-colors">导数的几何意义</h3>
                    <div class="flex items-center gap-2 text-sm">
                      <span class="px-2 py-0.5 rounded-md bg-[var(--ailp-muted)] text-[var(--ailp-muted-foreground)] text-xs">高二(3)班</span>
                      <span class="px-2 py-0.5 rounded-md bg-[var(--ailp-accent)]/10 text-[var(--ailp-accent-600)] text-xs font-medium">讲练结合</span>
                      <span class="text-[var(--ailp-gray-400)]">·</span>
                      <span class="text-[var(--ailp-muted-foreground)] text-xs">2天前</span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="px-2.5 py-1 rounded-full bg-[var(--ailp-success-500)]/10 text-[var(--ailp-success-600)] text-xs font-medium">已完成</span>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--ailp-gray-300)] group-hover:text-[var(--ailp-primary)] group-hover:translate-x-0.5 transition-all"></i>
                </div>
              </div>
            </div>

            <!-- Item 3 -->
            <div class="group bg-white/80 backdrop-blur-sm rounded-xl p-5 border border-[var(--ailp-border)] hover:border-[var(--ailp-primary)]/30 hover:shadow-md transition-all cursor-pointer">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#8b5cf6] to-[#7c3aed] flex items-center justify-center text-white shadow-md">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="font-semibold text-[var(--ailp-foreground)] mb-1 group-hover:text-[var(--ailp-primary)] transition-colors">等差数列前n项和（复习课）</h3>
                    <div class="flex items-center gap-2 text-sm">
                      <span class="px-2 py-0.5 rounded-md bg-[var(--ailp-muted)] text-[var(--ailp-muted-foreground)] text-xs">高二(5)班</span>
                      <span class="px-2 py-0.5 rounded-md bg-[#8b5cf6]/10 text-[#7c3aed] text-xs font-medium">复习讲评</span>
                      <span class="text-[var(--ailp-gray-400)]">·</span>
                      <span class="text-[var(--ailp-muted-foreground)] text-xs">3天前</span>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span class="px-2.5 py-1 rounded-full bg-[var(--ailp-success-500)]/10 text-[var(--ailp-success-600)] text-xs font-medium">已完成</span>
                  <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--ailp-gray-300)] group-hover:text-[var(--ailp-primary)] group-hover:translate-x-0.5 transition-all"></i>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Floating AI Assistant Button -->
      <div class="fixed bottom-8 right-8 z-50">
        <button class="floating-ai-btn w-14 h-14 rounded-full flex items-center justify-center text-white hover:scale-110 transition-transform animate-float">
          <i data-lucide="bot" class="w-6 h-6"></i>
          <!-- Tooltip -->
          <div class="tooltip-bubble">
            <span class="px-3 py-1.5 bg-[#1e293b] text-white text-xs rounded-lg shadow-lg">AI 助手</span>
          </div>
        </button>
      </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
