/* ============================================================
   AI 备课工作台 - 设计令牌 / Design Tokens
   ============================================================ */

:root {
  /* ---- Primary Brand ---- */
  --ailp-primary-50: #eef2ff;
  --ailp-primary-100: #e0e7ff;
  --ailp-primary-200: #c7d2fe;
  --ailp-primary-300: #a5b4fc;
  --ailp-primary-400: #818cf8;
  --ailp-primary-500: #6366f1;
  --ailp-primary-600: #4f46e5;
  --ailp-primary-700: #4338ca;
  --ailp-primary-800: #3730a3;
  --ailp-primary-900: #312e81;

  /* ---- Accent (teal / AI glow) ---- */
  --ailp-accent-50: #ecfeff;
  --ailp-accent-100: #cffafe;
  --ailp-accent-200: #a5f3fc;
  --ailp-accent-300: #67e8f9;
  --ailp-accent-400: #22d3ee;
  --ailp-accent-500: #06b6d4;
  --ailp-accent-600: #0891b2;

  /* ---- Neutrals ---- */
  --ailp-gray-50: #f8fafc;
  --ailp-gray-100: #f1f5f9;
  --ailp-gray-200: #e2e8f0;
  --ailp-gray-300: #cbd5e1;
  --ailp-gray-400: #94a3b8;
  --ailp-gray-500: #64748b;
  --ailp-gray-600: #475569;
  --ailp-gray-700: #334155;
  --ailp-gray-800: #1e293b;
  --ailp-gray-900: #0f172a;
  --ailp-gray-950: #020617;

  /* ---- Success / Warning / Error ---- */
  --ailp-success-500: #10b981;
  --ailp-success-600: #059669;
  --ailp-warning-500: #f59e0b;
  --ailp-warning-600: #d97706;
  --ailp-error-500: #ef4444;
  --ailp-error-600: #dc2626;

  /* ---- Semantic aliases ---- */
  --ailp-background: #f8fafc;
  --ailp-foreground: #0f172a;
  --ailp-card: #ffffff;
  --ailp-card-foreground: #0f172a;
  --ailp-popover: #ffffff;
  --ailp-popover-foreground: #0f172a;
  --ailp-primary: #4f46e5;
  --ailp-primary-foreground: #ffffff;
  --ailp-secondary: #f1f5f9;
  --ailp-secondary-foreground: #0f172a;
  --ailp-muted: #f1f5f9;
  --ailp-muted-foreground: #64748b;
  --ailp-accent: #06b6d4;
  --ailp-accent-foreground: #ffffff;
  --ailp-destructive: #ef4444;
  --ailp-destructive-foreground: #ffffff;
  --ailp-border: #e2e8f0;
  --ailp-input: #e2e8f0;
  --ailp-ring: #6366f1;

  /* ---- Radius scale ---- */
  --ailp-radius-sm: 6px;
  --ailp-radius-md: 10px;
  --ailp-radius-lg: 14px;
  --ailp-radius-xl: 20px;
  --ailp-radius-2xl: 28px;
  --ailp-radius-full: 9999px;

  /* ---- Shadow scale ---- */
  --ailp-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --ailp-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  --ailp-shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
  --ailp-shadow-xl: 0 20px 40px -10px rgba(15, 23, 42, 0.15);
  --ailp-shadow-glow: 0 0 30px rgba(99, 102, 241, 0.25);

  /* ---- Typography ---- */
  --ailp-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial,
    sans-serif;
  --ailp-font-mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas,
    "Liberation Mono", Menlo, monospace;
  --ailp-font-math: "Cambria Math", "Latin Modern Math", "STIX Two Math",
    Georgia, serif;
}

/* ---- Dark mode (editor focus mode) ---- */
.dark {
  --ailp-background: #0f172a;
  --ailp-foreground: #f8fafc;
  --ailp-card: #1e293b;
  --ailp-card-foreground: #f8fafc;
  --ailp-popover: #1e293b;
  --ailp-popover-foreground: #f8fafc;

  --ailp-secondary-foreground: #f8fafc;
  --ailp-muted: #334155;
  --ailp-muted-foreground: #94a3b8;
  --ailp-border: #334155;
  --ailp-input: #334155;
  --ailp-ring: #6366f1;
}

/* ---- Base reset ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: var(--ailp-font-sans);
  background: var(--ailp-background);
  color: var(--ailp-foreground);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- Scrollbar ---- */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--ailp-gray-300);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--ailp-gray-400);
}

/* ---- Math formula display ---- */
.math-display {
  font-family: var(--ailp-font-math);
  font-size: 1.1em;
  line-height: 1.8;
}

.math-inline {
  font-family: var(--ailp-font-math);
  font-style: italic;
}

/* ---- Utility: AI glow effect ---- */
.ai-glow {
  position: relative;
}
.ai-glow::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: inherit;
  background: linear-gradient(
    135deg,
    rgba(99, 102, 241, 0.3),
    rgba(6, 182, 212, 0.3)
  );
  filter: blur(12px);
  opacity: 0.6;
  z-index: -1;
  pointer-events: none;
}

/* ---- Gradient text ---- */
.gradient-text {
  background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ---- AI message bubble gradient ---- */
.ai-bubble-gradient {
  background: linear-gradient(
    135deg,
    rgba(99, 102, 241, 0.08) 0%,
    rgba(6, 182, 212, 0.06) 100%
  );
  border: 1px solid rgba(99, 102, 241, 0.15);
}

<body class="min-h-screen font-sans antialiased">
    <style>
      /* AI Glow animations */
      @keyframes ai-glow-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-float { animation: float 4s ease-in-out infinite; }
      .animate-glow-pulse { animation: ai-glow-pulse 3s ease-in-out infinite; }
      .animate-fade-in-up { animation: fade-in-up 0.8s ease-out both; }
      .delay-100 { animation-delay: 0.1s; }
      .delay-200 { animation-delay: 0.2s; }
      .delay-300 { animation-delay: 0.3s; }
      .delay-400 { animation-delay: 0.4s; }
      .delay-500 { animation-delay: 0.5s; }

      /* Input glow border effect */
      .input-glow-wrapper {
        position: relative;
        border-radius: var(--ailp-radius-2xl);
        padding: 2px;
        background: linear-gradient(135deg, rgba(79, 70, 229, 0.4), rgba(6, 182, 212, 0.4), rgba(79, 70, 229, 0.4));
        background-size: 200% 200%;
        animation: shimmer 4s linear infinite;
      }
      .input-glow-wrapper::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: calc(var(--ailp-radius-2xl) + 6px);
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(6, 182, 212, 0.15));
        filter: blur(16px);
        z-index: -1;
        animation: ai-glow-pulse 3s ease-in-out infinite;
      }

      /* Floating AI button */
      .floating-ai-btn {
        position: relative;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
        box-shadow: 0 8px 32px rgba(79, 70, 229, 0.4), 0 0 60px rgba(6, 182, 212, 0.2);
      }
      .floating-ai-btn::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 9999px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(6, 182, 212, 0.5));
        filter: blur(12px);
        z-index: -1;
        animation: ai-glow-pulse 2.5s ease-in-out infinite;
      }

      /* Tooltip */
      .tooltip-bubble {
        position: absolute;
        right: 100%;
        top: 50%;
        transform: translateY(-50%);
        margin-right: 12px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .tooltip-bubble::after {
        content: "";
        position: absolute;
        left: 100%;
        top: 50%;
        transform: translateY(-50%);
        border: 6px solid transparent;
        border-left-color: var(--ailp-gray-800);
      }
      .floating-ai-btn:hover .tooltip-bubble {
        opacity: 1;
      }

      /* Card hover effects */
      .quick-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .quick-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px -10px rgba(79, 70, 229, 0.15), 0 10px 20px -5px rgba(6, 182, 212, 0.1);
      }

      /* Background decorative blobs */
      .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.4;
        pointer-events: none;
      }
    </style>
    <style id="critical-layout">
      /* ---- Page-critical layout CSS（无 Tailwind 运行时编译时仍可正确渲染） ---- */
      .tpl-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .tpl-topbar {
        position: sticky; top: 0; z-index: 40;
        border-bottom: 1px solid var(--ailp-border);
        background: rgba(255, 255, 255, 0.8);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      .tpl-topbar-inner {
        max-width: 1152px; margin: 0 auto; padding: 0 24px;
        height: 56px; display: flex; align-items: center; gap: 16px;
      }
      .tpl-shell {
        position: relative;
        max-width: 1152px; margin: 0 auto;
        padding: 24px 24px 112px; /* pb 预留固定底栏 64px 安全区 */
        display: flex; align-items: flex-start; gap: 24px;
      }
      .tpl-gallery { flex: 1 1 0%; min-width: 0; }
      .tpl-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
      .tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .tpl-card { display: block; width: 100%; text-align: left; cursor: pointer; }
      .tpl-panel {
        width: 320px; flex: 0 0 320px;
        position: sticky; top: 80px;
        border: 1px solid var(--ailp-border); border-radius: 16px;
        background: rgba(255, 255, 255, 0.8);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        padding: 20px;
      }
      .tpl-preview { height: 112px; }
      .tpl-preview-cover { height: 128px; }
      .tpl-preview-page { height: 96px; }
      .tpl-bottombar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        border-top: 1px solid var(--ailp-border);
        background: rgba(255, 255, 255, 0.9);
        -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      .tpl-bottombar-inner {
        max-width: 1152px; margin: 0 auto; padding: 0 24px;
        height: 64px; display: flex; align-items: center; justify-content: space-between;
      }
      @media (min-width: 1280px) {
        .tpl-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (max-width: 1023px) {
        .tpl-shell { flex-direction: column; }
        .tpl-panel { width: 100%; flex: 0 0 auto; position: static; }
      }
      @media (max-width: 639px) {
        .tpl-grid { grid-template-columns: 1fr; }
        .tpl-topbar-inner, .tpl-shell, .tpl-bottombar-inner { padding-left: 16px; padding-right: 16px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-float, .animate-glow-pulse, .animate-fade-in-up { animation: none; }
        .floating-ai-btn:hover { transform: none; }
      }
    </style>
